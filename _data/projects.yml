# GitHub Pages sites published from simonseo's repos.
# Every project repo with Pages enabled is served under simonseo.github.io/<repo>/
# (or a custom URL), since simonseo.github.io is a user site.
#
# fields:
#   name        — display text for the sitemap link
#   url         — published URL
#   description — optional one-liner shown after the link
#   group       — "project" for apps/tools/sites, "coursework" for class work

